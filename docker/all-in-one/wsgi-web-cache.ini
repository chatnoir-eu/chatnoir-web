[uwsgi]
chdir2 = .
http = 0.0.0.0:8001
http-timeout = 900
master = true
callable = application
static-map = /static=/opt/chatnoir-web/chatnoir/chatnoir_static
buffer-size = 65535
lazy = true
die-on-term = true
enable-threads = true
offload-threads = %k
threads = 4
processes = 4
cheaper-algo = spare2
cheaper = 2
cheaper-initial = 2
cheaper-idle = 60
